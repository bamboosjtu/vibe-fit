server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 使用 Docker 内置 DNS 解析器，使 nginx 在运行时解析 upstream
    # 避免 backend 容器未就绪时 nginx 启动失败（host not found in upstream）
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream "backend";

    # SPA fallback：所有前端路由都回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理 API 请求到后端（同源访问，无需 CORS）
    location /api/ {
        proxy_pass http://$backend_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查与就绪检查
    location ~ ^/(health|healthz|readyz)$ {
        proxy_pass http://$backend_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
