name: vibefit

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: ${POSTGRES_IMAGE:?load images.lock.env}
    restart: unless-stopped
    user: "70:70"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vibefit}
      POSTGRES_DB: ${POSTGRES_DB:-vibefit}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --data-checksums
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - fsync=on
      - -c
      - full_page_writes=on
      - -c
      - synchronous_commit=on
      - -c
      - shared_buffers=256MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - work_mem=4MB
      - -c
      - wal_compression=on
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_wal_size=512MB
      - -c
      - log_min_duration_statement=1000
    volumes:
      - ${VIBEFIT_DATA_DIR:-/srv/vibefit/data}/postgres:/var/lib/postgresql/data
    read_only: true
    tmpfs:
      - /var/run/postgresql:uid=70,gid=70,mode=3775,size=16m
      - /tmp:uid=70,gid=70,mode=0700,size=32m
    secrets:
      - source: postgres_password
        target: postgres_password
        uid: "70"
        gid: "70"
        mode: 0400
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 256
    shm_size: 256m
    stop_grace_period: 60s
    logging: *default-logging

  migrate:
    image: ${BACKEND_IMAGE:?load images.lock.env}
    restart: "no"
    command: ["migrate"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - source: database_url
        target: database_url
        uid: "1000"
        gid: "1000"
        mode: 0400
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    pids_limit: 128
    logging: *default-logging

  worker:
    image: ${WORKER_IMAGE:?load images.lock.env}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "8080"
      AUTH_MODE: mock
      DATA_MODE: postgres
      EVENT_PUBLISHER: mock
      DATABASE_URL_FILE: /run/secrets/database_url
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      APP_VERSION: ${RELEASE_VERSION:-1.1.0}
      GIT_REVISION: ${GIT_REVISION:-unknown}
      DATABASE_SCHEMA_VERSION: "1"
      BACKUP_RETENTION_DAYS: "90"
      BACKUP_MIN_SNAPSHOTS: "10"
      LOG_PRETTY: "false"
      TZ: ${TZ:-Asia/Shanghai}
    secrets:
      - source: database_url
        target: database_url
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: jwt_secret
        target: jwt_secret
        uid: "1000"
        gid: "1000"
        mode: 0400
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 384m
    cpus: 0.75
    pids_limit: 128
    stop_grace_period: 30s
    logging: *default-logging

  backend:
    image: ${BACKEND_IMAGE:?load images.lock.env}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "8080"
      AUTH_MODE: email
      DATA_MODE: postgres
      EVENT_PUBLISHER: local
      DATABASE_URL_FILE: /run/secrets/database_url
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in config.env}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:?set SMTP_USER in config.env}
      SMTP_PASS_FILE: /run/secrets/smtp_password
      SMTP_FROM: ${SMTP_FROM:?set SMTP_FROM in config.env}
      VERIFY_CODE_TTL_SECONDS: ${VERIFY_CODE_TTL_SECONDS:-300}
      VERIFY_CODE_LENGTH: ${VERIFY_CODE_LENGTH:-6}
      CORS_ORIGIN: https://${VIBEFIT_HOST:?set VIBEFIT_HOST in config.env},https://localhost
      WORKER_PUSH_URL: http://worker:8080/pubsub/backups
      APP_VERSION: ${RELEASE_VERSION:-1.1.0}
      GIT_REVISION: ${GIT_REVISION:-unknown}
      DATABASE_SCHEMA_VERSION: "1"
      MAX_BACKUP_BYTES: "10485760"
      LOG_PRETTY: "false"
      TZ: ${TZ:-Asia/Shanghai}
    secrets:
      - source: database_url
        target: database_url
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: jwt_secret
        target: jwt_secret
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: smtp_password
        target: smtp_password
        uid: "1000"
        gid: "1000"
        mode: 0400
    depends_on:
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 30s
    logging: *default-logging

  frontend:
    image: ${FRONTEND_IMAGE:?load images.lock.env}
    restart: unless-stopped
    user: "101:101"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0750,size=16m
      - /var/run:uid=101,gid=101,mode=0750,size=4m
      - /tmp:uid=101,gid=101,mode=0700,size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging: *default-logging

  caddy:
    image: ${CADDY_IMAGE:?load images.lock.env}
    restart: unless-stopped
    user: "1000:1000"
    environment:
      VIBEFIT_HOST: ${VIBEFIT_HOST:?set VIBEFIT_HOST in config.env}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    secrets:
      - source: tls_cert
        target: tls_cert
        uid: "1000"
        gid: "1000"
        mode: 0444
      - source: tls_key
        target: tls_key
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: root_ca
        target: root_ca
        uid: "1000"
        gid: "1000"
        mode: 0444
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --cacert /run/secrets/root_ca --resolve $${VIBEFIT_HOST}:443:127.0.0.1 https://$${VIBEFIT_HOST}/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /config:uid=1000,gid=1000,mode=0700,size=8m
      - /data:uid=1000,gid=1000,mode=0700,size=16m
      - /tmp:uid=1000,gid=1000,mode=0700,size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    stop_grace_period: 30s
    logging: *default-logging

  maintenance:
    profiles: ["backup"]
    image: ${MAINTENANCE_IMAGE:?load images.lock.env}
    user: "70:70"
    environment:
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      BACKUP_HOST: ${BACKUP_HOST:-vibefit-rpi}
      BACKUP_WORK_DIR: /work
      SERVER_CONFIG_DIR: /server-config
      DATABASE_URL_FILE: /run/secrets/database_url
      RESTIC_REPOSITORY: /backup/repository
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      RESTIC_CACHE_DIR: /work/restic-cache
      RESTIC_CHECK_SUBSET: ${RESTIC_CHECK_SUBSET:-5%}
      CONFIRM_RESTORE: ${CONFIRM_RESTORE:-NO}
      RESTORE_SNAPSHOT: ${RESTORE_SNAPSHOT:-latest}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${VIBEFIT_BACKUP_DIR:-/srv/vibefit/backup-not-configured}:/backup
      - ${VIBEFIT_BACKUP_WORK_DIR:-/srv/vibefit/backup-work}:/work
      - ${VIBEFIT_RESTORE_DIR:-/srv/vibefit/restore-work}:/restore
      - ./compose.yaml:/server-config/compose.yaml:ro
      - ./Caddyfile:/server-config/Caddyfile:ro
      - ./config.env:/server-config/config.env:ro
      - ./images.lock.env:/server-config/images.lock.env:ro
      - ${TLS_CERT_FILE_PATH:-./secrets/tls_cert.pem}:/server-config/tls_cert.pem:ro
    secrets:
      - source: database_url
        target: database_url
        uid: "70"
        gid: "70"
        mode: 0400
      - source: restic_password
        target: restic_password
        uid: "70"
        gid: "70"
        mode: 0400
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:uid=70,gid=70,mode=0700,size=32m
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.75
    pids_limit: 128
    logging: *default-logging

secrets:
  postgres_password:
    environment: VIBEFIT_SECRET_POSTGRES_PASSWORD
  database_url:
    environment: VIBEFIT_SECRET_DATABASE_URL
  jwt_secret:
    environment: VIBEFIT_SECRET_JWT_SECRET
  smtp_password:
    environment: VIBEFIT_SECRET_SMTP_PASSWORD
  tls_cert:
    environment: VIBEFIT_SECRET_TLS_CERT
  tls_key:
    environment: VIBEFIT_SECRET_TLS_KEY
  root_ca:
    environment: VIBEFIT_SECRET_ROOT_CA
  restic_password:
    environment: VIBEFIT_SECRET_RESTIC_PASSWORD
