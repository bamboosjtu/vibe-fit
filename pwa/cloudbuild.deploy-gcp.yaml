# Cloud Build: 部署 Backend + Worker 到 Cloud Run（不构建镜像）
#
# 前提：镜像已由 cloudbuild.publish.yaml 推送到 Artifact Registry。
#
# 触发方式：
#   gcloud builds submit --config=cloudbuild.deploy-gcp.yaml \
#     --substitutions=_REGION=asia-east1,_REPO=vibe-fit,_IMAGE_TAG=$BUILD_ID \
#     pwa/
#
# 说明：
#   - Backend 使用 vibe-fit-backend 镜像，不覆盖 command/args
#   - Worker 使用 vibe-fit-worker 镜像，不覆盖 command/args
#   - 两个服务分别部署、分别回滚

substitutions:
  _REGION: asia-east1
  _REPO: vibe-fit
  _IMAGE_TAG: latest
  _BACKEND_SERVICE: vibe-fit-backend-dev
  _WORKER_SERVICE: vibe-fit-worker-dev

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # ── 1. 部署 Backend 到 Cloud Run ─────────────────────────
  #    使用 Backend 镜像，不覆盖 command/args
  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_BACKEND_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/vibe-fit-backend:${_IMAGE_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --set-env-vars=NODE_ENV=production,AUTH_MODE=email,DATA_MODE=postgres,EVENT_PUBLISHER=local,LOG_PRETTY=false

  # ── 2. 部署 Worker 到 Cloud Run ──────────────────────────
  #    使用 Worker 镜像，不覆盖 command/args
  #    Worker 镜像自带 CMD ["node", "dist/worker.js"]
  - id: deploy-worker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_WORKER_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/vibe-fit-worker:${_IMAGE_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --set-env-vars=NODE_ENV=production,AUTH_MODE=mock,DATA_MODE=mock,EVENT_PUBLISHER=mock,LOG_PRETTY=false
