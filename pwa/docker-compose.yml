# VibeFit PWA 本地 Docker 部署
#
# 用法：在 pwa/ 目录下执行
#   docker compose up -d --build
#
# 访问地址：
#   前端：   http://localhost:8081
#   后端 API：http://localhost:8080
#   Postgres：localhost:5432 (vibefit / vibefit_dev_password / vibefit_dev)
#
# 说明：本地部署默认使用邮箱验证码登录、postgres 数据库、本地 worker 事件处理，
#       全部服务运行在本地 Docker，不依赖任何云服务。

services:
  postgres:
    image: postgres:15-alpine
    container_name: vibefit-postgres
    environment:
      POSTGRES_USER: vibefit
      POSTGRES_PASSWORD: vibefit_dev_password
      POSTGRES_DB: vibefit_dev
    ports:
      - "5432:5432"
    volumes:
      - vibe_fit_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibefit -d vibefit_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 一次性迁移服务：使用 builder 阶段（含 prisma CLI），执行完毕即退出
  migrate:
    build:
      context: ./backend
      target: builder
    container_name: vibefit-migrate
    environment:
      DATABASE_URL: postgres://vibefit:vibefit_dev_password@postgres:5432/vibefit_dev
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    container_name: vibefit-backend
    environment:
      NODE_ENV: production
      PORT: "8080"
      AUTH_MODE: email
      DATA_MODE: postgres
      EVENT_PUBLISHER: local
      DATABASE_URL: postgres://vibefit:vibefit_dev_password@postgres:5432/vibefit_dev
      JWT_SECRET: dev-only-secret
      CORS_ORIGIN: http://localhost:8081,http://localhost:8080,http://localhost:5173
      LOG_PRETTY: "false"
      WORKER_PUSH_URL: http://worker:8080/pubsub/backups
      # ===== 邮箱验证码（163 邮箱）=====
      # 部署前请填写以下 SMTP 配置，详见 pwa/docs/deployment.md
      SMTP_HOST: ""
      SMTP_PORT: "465"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: ""
      VERIFY_CODE_TTL_SECONDS: "300"
      VERIFY_CODE_LENGTH: "6"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # 本地事件 worker：接收 backend 通过 HTTP push 推来的 backup.created 事件
  worker:
    build:
      context: ./backend
    container_name: vibefit-worker
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      PORT: "8080"
      AUTH_MODE: mock
      DATA_MODE: mock
      EVENT_PUBLISHER: mock
      LOG_PRETTY: "false"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        # 浏览器访问后端的地址（构建期注入）
        VITE_API_BASE_URL: http://localhost:8080
        VITE_AUTH_MODE: email
    container_name: vibefit-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  vibe_fit_pg_data:
