# VibeFit Frontend (PWA/H5) 本地容器栈
#
# 用法：在 pwa/ 目录下
#   docker compose up -d --build
#
# 服务：
#   frontend : nginx + 构建产物 + Service Worker（:8081）
#
# PWA 是纯前端离线优先应用，本地数据（IndexedDB）为唯一可信源。
# 不依赖 backend 容器；nginx 反代 /api/* 到 upstream "backend" 用于可选云端备份联调，
# 若 backend 未启动，静态资源与 SW 仍正常工作，仅 /api/* 返回 502。
# 需要联调时另起 backend/docker-compose.yml，并加入同一 Docker 网络。
#
# 访问：http://localhost:8081

services:
  frontend:
    build:
      context: .
      args:
        # 不设置 VITE_API_BASE_URL → 前端使用同源相对路径 /api/*
        # 通过 nginx 反代或部署侧网关访问后端，无需 CORS
        VITE_AUTH_MODE: email
    container_name: vibefit-frontend
    ports:
      - "8081:80"
