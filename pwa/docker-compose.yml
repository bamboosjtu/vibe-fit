# VibeFit PWA 本地 Docker 部署
#
# 用法：在 pwa/ 目录下执行
#   docker compose up -d --build
#
# 访问地址：
#   前端：   http://localhost:8081
#   后端 API：http://localhost:8080
#   Postgres：localhost:5432 (vibefit / vibefit_dev_password / vibefit_dev)
#
# 说明：本地部署默认使用邮箱验证码登录、postgres 数据库、本地 worker 事件处理，
#       全部服务运行在本地 Docker，不依赖任何云服务。
#       数据库 schema 固定为版本 1，由 backend 启动时通过 entrypoint 脚本执行
#       prisma migrate deploy 初始化，无需独立迁移服务。

services:
  postgres:
    image: postgres:15-alpine
    container_name: vibefit-postgres
    environment:
      POSTGRES_USER: vibefit
      POSTGRES_PASSWORD: vibefit_dev_password
      POSTGRES_DB: vibefit_dev
    ports:
      - "5432:5432"
    volumes:
      - vibe_fit_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibefit -d vibefit_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: vibefit-backend
    # 从 backend/.env 加载 SMTP 等配置（由用户填写 163 邮箱凭据）。
    # environment 段中的容器网络相关变量会覆盖 .env 中的同名项。
    env_file:
      ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "8080"
      AUTH_MODE: email
      DATA_MODE: postgres
      EVENT_PUBLISHER: local
      DATABASE_URL: postgres://vibefit:vibefit_dev_password@postgres:5432/vibefit_dev
      JWT_SECRET: dev-only-secret
      CORS_ORIGIN: http://localhost:8081,http://localhost:8080,http://localhost:5173,http://127.0.0.1:8081,http://127.0.0.1:8080,http://127.0.0.1:5173
      LOG_PRETTY: "false"
      WORKER_PUSH_URL: http://worker:8080/pubsub/backups
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # 本地事件 worker：接收 backend 通过 HTTP push 推来的 backup.created 事件
  # worker 使用 mock 数据模式，不连接数据库，故覆盖 entrypoint 直接启动 node
  worker:
    build:
      context: ./backend
    container_name: vibefit-worker
    entrypoint: ["node"]
    command: ["dist/worker.js"]
    environment:
      NODE_ENV: production
      PORT: "8080"
      AUTH_MODE: mock
      DATA_MODE: mock
      EVENT_PUBLISHER: mock
      JWT_SECRET: dev-only-secret
      LOG_PRETTY: "false"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # 浏览器访问后端的地址（构建期注入）
        VITE_API_BASE_URL: http://localhost:8080
        VITE_AUTH_MODE: email
    container_name: vibefit-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  vibe_fit_pg_data:
