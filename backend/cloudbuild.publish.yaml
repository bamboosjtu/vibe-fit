# Cloud Build: 仅发布 Backend + Worker 镜像（不部署）
#
# 触发方式：
#   gcloud builds submit --config=cloudbuild.publish.yaml \
#     --substitutions=_REGION=asia-east1,_REPO=vibe-fit,_COMMIT_SHA=$(git rev-parse HEAD) \
#     backend/
#
# 产出：
#   - vibe-fit-backend:$BUILD_ID + vibe-fit-backend:$_COMMIT_SHA
#   - vibe-fit-worker:$BUILD_ID  + vibe-fit-worker:$_COMMIT_SHA
#
# 部署由独立配置 cloudbuild.deploy-gcp.yaml 完成。
# 树莓派发布不使用此文件；使用 scripts/publish-acr.sh 与摘要锁。

substitutions:
  _REGION: asia-east1
  _REPO: vibe-fit

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # ── 1. 类型检查（一次） ──────────────────────────────────
  - id: backend-typecheck
    name: node:24.19.0-alpine3.23@sha256:244cc2b53f46f9e876304391d17682b0ddae9ac33491f4857e25e35a36ba7995
    dir: .
    entrypoint: sh
    args:
      - -c
      - |
        npm ci
        npm run typecheck

  # ── 2. 构建 Backend 镜像（api-runtime） ──────────────────
  - id: build-backend-image
    name: gcr.io/cloud-builders/docker
    dir: .
    args:
      - build
      - --target=api-runtime
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/vibe-fit-backend:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/vibe-fit-backend:${_COMMIT_SHA}
      - .

  # ── 3. 构建 Worker 镜像（worker-runtime） ────────────────
  - id: build-worker-image
    name: gcr.io/cloud-builders/docker
    dir: .
    args:
      - build
      - --target=worker-runtime
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/vibe-fit-worker:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/vibe-fit-worker:${_COMMIT_SHA}
      - .

  # ── 4. 推送 Backend 镜像（两个标签） ─────────────────────
  - id: push-backend-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/vibe-fit-backend

  # ── 5. 推送 Worker 镜像（两个标签） ──────────────────────
  - id: push-worker-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/vibe-fit-worker

# 登记所有镜像标签（$BUILD_ID + $_COMMIT_SHA）
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/vibe-fit-backend:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/vibe-fit-backend:${_COMMIT_SHA}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/vibe-fit-worker:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/vibe-fit-worker:${_COMMIT_SHA}
